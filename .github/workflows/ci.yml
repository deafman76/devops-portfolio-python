name: CI Pipeline - Phase 1

# ============================================================================
# ТРИГГЕРЫ: когда запускается этот workflow
# ============================================================================
on:
  # На каждый push в main
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  
  # На каждый pull request в main
  pull_request:
    branches: [ main ]
  
  # Запустить вручную через GitHub UI
  workflow_dispatch:

# ============================================================================
# JOBS: что делать
# ============================================================================
jobs:
  
  # ========================================================================
  # ШАГ 1: Проверка кода (lint)
  # ========================================================================
  lint:
    name: Lint Code (ruff)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install ruff
        run: pip install ruff
      
      - name: Check code style
        run: ruff check app tests
      
      - name: Check code format
        run: ruff format --check app tests
  
  
  # ========================================================================
  # ШАГ 2: Запуск тестов
  # ========================================================================
  test:
    name: Run Tests (pytest)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run pytest
        run: pytest tests/ -v --tb=short
  
  
  # ========================================================================
  # ШАГ 3: Собрать Docker-образ
  # ========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]  # Запускается только если lint и test прошли
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false                                    # Не пушим, просто собираем
          tags: devops-portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


# ============================================================================
# РЕЗУЛЬТАТ
# ============================================================================
# Если всё зелёное:
# - Код прошёл ruff (нет ошибок стиля)
# - Тесты прошли
# - Docker-образ собрался успешно
#
# Если что-то красное:
# - GitHub покажет красный крест на PR/commit
# - Нажмите на крест → Details → вы увидите, на каком шаге ошибка
# - Исправьте в коде, запушьте заново