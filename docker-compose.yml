services:
  # =========================================================================
  # Основное приложение
  # =========================================================================
  app:
    # Можем либо собрать образ (build), либо использовать готовый (image)
    # Сейчас используем build для разработки
    build:
      context: .
      dockerfile: Dockerfile
    
    # Имя контейнера (для docker exec, logs, и т. д.)
    container_name: devops-portfolio-app
    
    # Порты: 8000 на машине -> 8000 в контейнере
    ports:
      - "8000:8000"
    
    # Переменные окружения (переопределяем значения из Dockerfile)
    environment:
      APP_NAME: devops-portfolio-app
      APP_VERSION: 0.1.0
      LOG_LEVEL: INFO
    
    # Volumes для горячей перезагрузки при разработке
    # Изменили код -> контейнер перезагружает приложение сам (за счёт uvicorn --reload)
    volumes:
      # Монтируем код приложения
      - ./app:/app/app:ro
      # :ro = read-only (защита от случайных изменений из контейнера)
    
    # Проверка здоровья контейнера
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Если контейнер упадёт, перезагрузить его
    restart: unless-stopped
    
    # Проксируем сигналы от Docker (для graceful shutdown)
    # При docker stop -> контейнер получит SIGTERM и корректно выключится
    init: true
  
  # =========================================================================
  # Сервис для тестирования (запускается отдельно)
  # =========================================================================
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: devops-portfolio-tests
    
    # Не пробрасываем порты (тесты не нужна сеть)
    
    # Тестам не нужны обновления кода, копируем всё
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
    
    # Команда: запустить pytest вместо uvicorn
    command: pytest tests/ -v --tb=short
    
    # Не перезагружаем при ошибке (тесты должны упасть и остановиться)
    restart: "no"

# =========================================================================
# Сети (опционально, но полезно для организации)
# =========================================================================
# Docker Compose автоматически создаёт сеть для сервисов.
# Но можно явно определить свою сеть.

networks:
  default:
    name: devops-portfolio-network
    driver: bridge
